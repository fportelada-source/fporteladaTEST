<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Perfil · Discoteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="perfil-content">
    <div style="text-align:center; padding:80px 20px; opacity:0.5; font-family:'JetBrains Mono', monospace; font-size:13px;">Carregando perfil...</div>
  </div>

  <footer>Discoteca — Sua coleção, suas recomendações.</footer>

  <script>
    const API_URL = 'https://fporteladaTEST.pythonanywhere.com';

    // ================================================================
    // LAST.FM (capas dos álbuns) — mesmo mecanismo já usado no resto do site
    // ================================================================
    const LASTFM_KEY = 'b25b959554ed76058ac220b7b2e0a026';

    async function getCoverUrl(artist, album) {
      if (!artist || !album) return null;
      try {
        const url =
          `https://ws.audioscrobbler.com/2.0/?method=album.getinfo&api_key=${LASTFM_KEY}&artist=${encodeURIComponent(artist)}&album=${encodeURIComponent(album)}&format=json`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.album && data.album.image) {
          const img = data.album.image.find(i => i.size === 'extralarge');
          return img && img['#text'] ? img['#text'] : null;
        }
        return null;
      } catch {
        return null;
      }
    }

    async function fetchAlbumArt(artist, album, artId, fallbackId) {
      const artWrap = document.getElementById(artId);
      const fallback = document.getElementById(fallbackId);
      if (!artWrap) return;
      try {
        const url = await getCoverUrl(artist, album);
        if (url) {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          await new Promise((resolve, reject) => {
            const timeout = setTimeout(() => reject(new Error('Timeout')), 10000);
            img.onload = () => {
              clearTimeout(timeout);
              artWrap.style.backgroundImage = `url('${url}')`;
              if (fallback) fallback.style.opacity = '0';
              resolve();
            };
            img.onerror = () => { clearTimeout(timeout); reject(new Error('Failed')); };
            img.src = url;
          });
        } else if (fallback) {
          fallback.style.opacity = '0.8';
        }
      } catch {
        if (fallback) fallback.style.opacity = '0.8';
      }
    }

    // ================================================================
    // AVATAR FALLBACK (cor + iniciais, quando não há capa)
    // ================================================================
    const CORES = ['#D6432F', '#E39A2E', '#4E7A8C', '#8A8378', '#5C6B7A', '#B8A88A', '#E8C87A', '#7AB8D8', '#A78BFA'];
    function getCor(texto) {
      const hash = (texto || '').split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
      return CORES[hash % CORES.length];
    }
    function getIniciais(artista, album) {
      const a = (artista || '').split(' ').map(w => w[0]).join('').slice(0, 3);
      const b = (album || '').split(' ').map(w => w[0]).join('').slice(0, 3);
      return `${a}\n${b}`;
    }

    // ================================================================
    // CARREGAR E RENDERIZAR PERFIL
    // ================================================================
    function carregarPerfil() {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get('id');

      if (!userId) {
        document.getElementById('perfil-content').innerHTML =
          `<div style="text-align:center; padding:80px 20px;">Perfil não especificado. Use o link com <code>?id=</code>.</div>`;
        return;
      }

      fetch(API_URL + `/perfil/${userId}`)
        .then(r => {
          if (!r.ok) throw new Error('Perfil não encontrado');
          return r.json();
        })
        .then(renderPerfil)
        .catch(err => {
          document.getElementById('perfil-content').innerHTML =
            `<div style="text-align:center; padding:80px 20px;">${err.message || 'Erro ao carregar perfil'}</div>`;
        });
    }

    function renderPerfil(data) {
      const container = document.getElementById('perfil-content');
      const nome = data.nome || 'Colecionador';
      const ano = data.data_criacao ? data.data_criacao.split('-')[0] : '';
      const avatarHtml = data.foto_url
        ? `<img src="${data.foto_url}" alt="${nome}">`
        : nome.charAt(0).toUpperCase();

      let redesHtml = '';
      if (data.spotify_url) redesHtml += `<a href="${data.spotify_url}" target="_blank">Spotify</a>`;
      if (data.discogs_url) redesHtml += `<a href="${data.discogs_url}" target="_blank">Discogs</a>`;
      if (data.instagram_url) redesHtml += `<a href="${data.instagram_url}" target="_blank">Instagram</a>`;
      if (!redesHtml) redesHtml = `<span class="sem-redes">Sem redes sociais adicionadas</span>`;

      let html = `
        <header class="pp-header">
          <div class="pp-avatar">${avatarHtml}</div>
          <div>
            <div class="pp-nome">${nome}</div>
            ${ano ? `<div class="pp-desde">Colecionando desde ${ano}</div>` : ''}
            ${data.bio ? `<div class="pp-bio">${data.bio}</div>` : ''}
            <div class="pp-redes">${redesHtml}</div>
          </div>
        </header>

        <div class="pp-metrics">
          <div class="pp-metric-item"><span class="num">${data.total_discos || 0}</span><span class="label">Discos</span></div>
          <div class="pp-metric-item"><span class="num" style="color:var(--s-color);">${data.total_wishlist || 0}</span><span class="label">Wishlist</span></div>
        </div>
      `;

      // Coleção
      html += `<section class="section"><h2 style="font-family:'Anton',sans-serif; font-size:20px; margin-bottom:14px;">Coleção</h2>`;
      if (data.ultimos_discos && data.ultimos_discos.length > 0) {
        html += `<div class="pp-grid">`;
        data.ultimos_discos.forEach((item, idx) => {
          const cor = getCor(item.artista);
          html += `
            <div class="pp-item" data-artista="${item.artista}" data-album="${item.album}">
              <div class="art" id="pp-art-${idx}" style="background:${cor};">
                <div class="fallback" id="pp-fallback-${idx}">${getIniciais(item.artista, item.album)}</div>
              </div>
              <div class="info">
                <div class="album">${item.album || 'Álbum'}</div>
                <div class="artist">${item.artista || 'Artista'}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<p style="opacity:0.5; font-size:13px;">Este colecionador ainda não tem discos.</p>`;
      }
      html += `</section>`;

      // Wishlist
      html += `<section class="section" style="margin-top:24px;"><h2 style="font-family:'Anton',sans-serif; font-size:20px; margin-bottom:14px;">Wishlist</h2>`;
      if (data.wishlist && data.wishlist.length > 0) {
        html += `<div class="pp-grid">`;
        data.wishlist.forEach(item => {
          const corTier = { S: 'var(--s-color)', A: 'var(--a-color)', B: 'var(--b-color)', C: 'var(--c-color)' }[item.tier] || 'var(--c-color)';
          html += `
            <div class="pp-item">
              <div class="art" style="background:${corTier};">
                <span class="tier-badge" style="background:${corTier};">${item.tier}</span>
                <div class="fallback">${getIniciais(item.artista, item.album)}</div>
              </div>
              <div class="info">
                <div class="album">${item.album || 'Álbum'}</div>
                <div class="artist">${item.artista || 'Artista'}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<p style="opacity:0.5; font-size:13px;">Sem itens na wishlist no momento.</p>`;
      }
      html += `</section>`;

      container.innerHTML = html;

      document.querySelectorAll('.pp-item[data-artista]').forEach((el, idx) => {
        const artista = el.dataset.artista;
        const album = el.dataset.album;
        if (artista && album) {
          fetchAlbumArt(artista, album, `pp-art-${idx}`, `pp-fallback-${idx}`);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', carregarPerfil);
  </script>
</body>
</html>
