<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Perfil · Discoteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --paper: #EDE8DC;
      --ink: #1B1815;
      --card: #242019;
      --card-line: rgba(237,232,220,0.10);
      --s-color: #D6432F;
      --a-color: #E39A2E;
      --b-color: #4E7A8C;
      --c-color: #8A8378;
      --e-color: #5C6B7A;
      --colecao-color: #B8A88A;
      --vinil-color: #E8C87A;
      --cd-color: #7AB8D8;
      --cassete-color: #A78BFA;
      --dvd-color: #9B59B6;
      --groove: repeating-radial-gradient(circle at center, rgba(237,232,220,0.035) 0px, rgba(237,232,220,0.035) 1px, transparent 1px, transparent 3px);
    }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    ::selection { background: var(--s-color); color: var(--paper); }
    .perfil-header {
      position: relative;
      padding: 32px 6vw 24px;
      border-bottom: 1px solid var(--card-line);
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 20px;
    }
    .perfil-header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--groove);
      pointer-events: none;
      z-index: 0;
    }
    .perfil-header>* { position: relative; z-index: 1; }
    .perfil-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--s-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Anton', sans-serif;
      font-size: 32px;
      color: var(--ink);
      flex-shrink: 0;
      overflow: hidden;
    }
    .perfil-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .perfil-info { flex: 1; min-width: 160px; }
    .perfil-info h1 {
      font-family: 'Anton', sans-serif;
      font-size: 26px;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }
    .perfil-info .username {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--paper);
      opacity: 0.5;
      margin-top: 2px;
    }
    .perfil-info .bio {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.6;
      max-width: 44ch;
    }
    .perfil-info .redes {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .perfil-info .redes a {
      color: var(--paper);
      opacity: 0.5;
      font-size: 18px;
      transition: 0.2s;
      text-decoration: none;
    }
    .perfil-info .redes a:hover { opacity: 1; }
    .perfil-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .perfil-actions button {
      background: transparent;
      border: 1px solid var(--card-line);
      color: var(--paper);
      padding: 3px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .perfil-actions button:hover {
      background: var(--card-line);
      border-color: rgba(237,232,220,0.3);
    }
    .perfil-actions .btn-primary {
      background: var(--s-color);
      border-color: var(--s-color);
      color: var(--ink);
      font-weight: 600;
    }
    .perfil-actions .btn-primary:hover { opacity: 0.8; }
    .perfil-metrics {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding: 0 6vw 16px;
      border-bottom: 1px solid var(--card-line);
    }
    .metric-item {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .metric-item .num {
      font-family: 'Anton', sans-serif;
      font-size: 20px;
      line-height: 1;
      color: var(--paper);
    }
    .metric-item .label {
      font-size: 10px;
      opacity: 0.5;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
    }
    .metric-item .num.s-color { color: var(--s-color); }
    .metric-item .num.a-color { color: var(--a-color); }
    .metric-item .num.vinil-color { color: var(--vinil-color); }
    .perfil-genres {
      padding: 8px 6vw 0;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-size: 12px;
      opacity: 0.6;
      margin-bottom: 2px;
    }
    .perfil-genres span { font-weight: 500; }
    .perfil-genres .count { opacity: 0.4; font-size: 10px; }
    .section {
      padding: 18px 6vw 4px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--card-line);
      padding-bottom: 6px;
    }
    .section-header h2 {
      font-family: 'Anton', sans-serif;
      font-size: 18px;
      letter-spacing: 0.02em;
    }
    .section-header h2 span {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 400;
      opacity: 0.4;
      margin-left: 4px;
    }
    .section-header .link {
      font-size: 11px;
      opacity: 0.5;
      cursor: pointer;
      transition: 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .section-header .link:hover { opacity: 1; }
    .section-header .link.s-color { color: var(--s-color); opacity: 0.8; }
    .section-header .link.s-color:hover { opacity: 1; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      padding-bottom: 4px;
    }
    .grid-item {
      background: var(--card);
      border: 1px solid var(--card-line);
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .grid-item:hover {
      transform: translateY(-2px);
      border-color: rgba(237,232,220,0.2);
    }
    .grid-item .art {
      width: 100%;
      aspect-ratio: 1/1;
      background: #1a1815;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .grid-item .art .fallback {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 10px;
      text-align: center;
      color: rgba(255,255,255,0.8);
      padding: 0 8px;
      text-transform: uppercase;
      line-height: 1.2;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .grid-item .art .tier-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      color: var(--ink);
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--tier-color);
    }
    .grid-item .art .tier-badge.s { background: var(--s-color); }
    .grid-item .art .tier-badge.a { background: var(--a-color); }
    .grid-item .art .tier-badge.b { background: var(--b-color); }
    .grid-item .art .tier-badge.c { background: var(--c-color); }
    .grid-item .info {
      padding: 6px 8px 8px;
    }
    .grid-item .info .album {
      font-weight: 600;
      font-size: 10px;
      line-height: 1.2;
    }
    .grid-item .info .artist {
      font-size: 9px;
      opacity: 0.6;
      margin-top: 1px;
    }
    .grid-item .info .year {
      font-size: 9px;
      opacity: 0.3;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 1px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 28px;
      padding-bottom: 4px;
    }
    @media (max-width:700px) {
      .stats-grid { grid-template-columns: 1fr; gap: 10px; }
    }
    .stat-group h3 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.4;
      margin-bottom: 6px;
    }
    .stat-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .stat-bar .label {
      font-size: 11px;
      min-width: 44px;
      opacity: 0.7;
    }
    .stat-bar .track {
      flex: 1;
      height: 4px;
      background: var(--card-line);
      border-radius: 2px;
      overflow: hidden;
    }
    .stat-bar .track .fill {
      height: 100%;
      border-radius: 2px;
      background: var(--s-color);
      transition: width 0.6s ease;
    }
    .stat-bar .track .fill.vinil { background: var(--vinil-color); }
    .stat-bar .track .fill.cd { background: var(--cd-color); }
    .stat-bar .track .fill.cassete { background: var(--cassete-color); }
    .stat-bar .track .fill.dvd { background: var(--dvd-color); }
    .stat-bar .track .fill.metal { background: #D6432F; }
    .stat-bar .track .fill.rock { background: #E39A2E; }
    .stat-bar .track .fill.jazz { background: #4E7A8C; }
    .stat-bar .track .fill.indie { background: #8A8378; }
    .stat-bar .track .fill.other { background: #5C6B7A; }
    .stat-bar .value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      min-width: 24px;
      text-align: right;
      opacity: 0.5;
    }
    .perfil-footer {
      padding: 24px 6vw 0;
      border-top: 1px solid var(--card-line);
      margin-top: 18px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: rgba(237,232,220,0.25);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .perfil-footer .social {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .perfil-footer .social a {
      color: var(--paper);
      opacity: 0.4;
      font-size: 12px;
      transition: 0.2s;
      text-decoration: none;
    }
    .perfil-footer .social a:hover { opacity: 1; }
    @media (max-width:600px) {
      .perfil-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 20px 4vw 16px;
        gap: 12px;
      }
      .perfil-info h1 { font-size: 20px; }
      .perfil-avatar { width: 56px; height: 56px; font-size: 24px; }
      .perfil-metrics { justify-content: center; gap: 10px 16px; padding: 0 4vw 12px; }
      .metric-item .num { font-size: 16px; }
      .perfil-genres { justify-content: center; padding: 4px 4vw 0; font-size: 11px; }
      .section { padding: 14px 4vw 4px; }
      .section-header h2 { font-size: 15px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
      .grid-item .info .album { font-size: 9px; }
      .grid-item .info .artist { font-size: 8px; }
      .stats-grid { grid-template-columns: 1fr; gap: 8px; }
      .perfil-actions { justify-content: center; }
    }
    @media (max-width:400px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    }
    .loading {
      text-align: center;
      padding: 48px 20px;
      opacity: 0.5;
    }
    .error {
      text-align: center;
      padding: 48px 20px;
      color: #f44336;
    }
    .redes-placeholder {
      font-size: 11px;
      opacity: 0.3;
    }
  </style>
</head>
<body>

  <!-- ===== PERFIL ===== -->
  <div id="perfil-content">
    <div class="loading">Carregando perfil...</div>
  </div>

  <footer class="perfil-footer">
    <div class="social">
      <a href="#">📷 Instagram</a>
      <a href="#">🎵 Spotify</a>
      <a href="#">💿 Discogs</a>
    </div>
    Discoteca · Sua coleção, suas recomendações.
  </footer>

  <script>
    const API_URL = 'https://fporteladatest.pythonanywhere.com';
    const CORES = ['#D6432F', '#E39A2E', '#4E7A8C', '#8A8378', '#5C6B7A', '#B8A88A', '#E8C87A', '#7AB8D8', '#A78BFA', '#9B59B6'];

    function getCor(artista) {
      const hash = artista.split('').reduce((acc, c) => acc + c.charCodeAt(0), 0);
      return CORES[hash % CORES.length];
    }

    function getIniciais(artista, album) {
      const a = artista.split(' ').map(w => w[0]).join('').slice(0, 3);
      const b = album.split(' ').map(w => w[0]).join('').slice(0, 3);
      return `${a}\n${b}`;
    }

    function carregarPerfil() {
      const params = new URLSearchParams(window.location.search);
      const userId = params.get('id');

      if (!userId) {
        document.getElementById('perfil-content').innerHTML = `
          <div class="error">❌ Usuário não especificado. Use ?id=123</div>
        `;
        return;
      }

      fetch(API_URL + `/perfil/${userId}`)
        .then(r => {
          if (!r.ok) throw new Error('Usuário não encontrado');
          return r.json();
        })
        .then(data => renderPerfil(data))
        .catch(err => {
          document.getElementById('perfil-content').innerHTML = `
            <div class="error">❌ ${err.message || 'Erro ao carregar perfil'}</div>
          `;
        });
    }

    function renderPerfil(data) {
      const container = document.getElementById('perfil-content');

      const { id, nome, email, data_criacao, foto_url, bio, discogs_url, spotify_url, instagram_url, total_discos, total_wishlist, ultimos_discos, wishlist } = data;

      const ano = data_criacao ? data_criacao.split('-')[0] : '2024';
      const avatarHtml = foto_url ? `<img src="${foto_url}" alt="Avatar">` : nome.charAt(0).toUpperCase();

      // Redes sociais
      let redesHtml = '';
      if (spotify_url) redesHtml += `<a href="${spotify_url}" target="_blank" title="Spotify">🎵</a>`;
      if (discogs_url) redesHtml += `<a href="${discogs_url}" target="_blank" title="Discogs">💿</a>`;
      if (instagram_url) redesHtml += `<a href="${instagram_url}" target="_blank" title="Instagram">📷</a>`;
      if (!redesHtml) redesHtml = `<span class="redes-placeholder">Sem redes sociais adicionadas</span>`;

      // Métricas
      let metricsHtml = `
        <div class="metric-item"><span class="num">${total_discos || 0}</span><span class="label">Discos</span></div>
        <div class="metric-item"><span class="num s-color">${total_wishlist || 0}</span><span class="label">Wishlist</span></div>
      `;

      let html = `
        <header class="perfil-header">
          <div class="perfil-avatar">${avatarHtml}</div>
          <div class="perfil-info">
            <h1>${nome}</h1>
            <div class="username">@${nome.toLowerCase().replace(/[^a-z0-9]/g, '')} · Colecionando desde ${ano}</div>
            ${bio ? `<div class="bio">${bio}</div>` : ''}
            <div class="redes">${redesHtml}</div>
            <div class="perfil-actions">
              <button class="btn-primary" onclick="copiarLink()">🔗 Copiar link</button>
            </div>
          </div>
        </header>

        <div class="perfil-metrics">${metricsHtml}</div>
      `;

      // Coleção
      if (ultimos_discos && ultimos_discos.length > 0) {
        html += `
          <section class="section">
            <div class="section-header">
              <h2>💿 Coleção <span>${total_discos || 0} discos</span></h2>
              <span class="link">Ver todos →</span>
            </div>
            <div class="grid">
        `;
        ultimos_discos.slice(0, 12).forEach(item => {
          const cor = getCor(item.artista);
          const iniciais = getIniciais(item.artista, item.album);
          html += `
            <div class="grid-item">
              <div class="art" style="background:${cor};">
                <div class="fallback">${iniciais}</div>
              </div>
              <div class="info">
                <div class="album">${item.album || 'Álbum'}</div>
                <div class="artist">${item.artista || 'Artista'}</div>
                <div class="year">${item.data_adicao ? item.data_adicao.split('-')[0] : ''}</div>
              </div>
            </div>
          `;
        });
        html += `</div></section>`;
      }

      // Wishlist
      if (wishlist && wishlist.length > 0) {
        html += `
          <section class="section">
            <div class="section-header">
              <h2>⭐ Wishlist <span>${total_wishlist || 0} discos</span></h2>
              <span class="link s-color">Ver todos →</span>
            </div>
            <div class="grid">
        `;
        wishlist.slice(0, 8).forEach(item => {
          const cor = item.tier === 'S' ? '#D6432F' : item.tier === 'A' ? '#E39A2E' : item.tier === 'B' ? '#4E7A8C' : '#8A8378';
          const iniciais = getIniciais(item.artista, item.album);
          html += `
            <div class="grid-item">
              <div class="art" style="background:${cor};">
                <span class="tier-badge ${item.tier.toLowerCase()}">${item.tier}</span>
                <div class="fallback">${iniciais}</div>
              </div>
              <div class="info">
                <div class="album">${item.album || 'Álbum'}</div>
                <div class="artist">${item.artista || 'Artista'}</div>
              </div>
            </div>
          `;
        });
        html += `</div></section>`;
      }

      // Estatísticas
      html += `
        <section class="section">
          <div class="section-header">
            <h2>📊 Estatísticas</h2>
          </div>
          <div class="stats-grid">
            <div class="stat-group">
              <h3>📅 Por Década</h3>
              <div class="stat-bar"><span class="label">1980s</span><div class="track"><div class="fill" style="width:60%;"></div></div><span class="value">18</span></div>
              <div class="stat-bar"><span class="label">1990s</span><div class="track"><div class="fill" style="width:50%;"></div></div><span class="value">15</span></div>
              <div class="stat-bar"><span class="label">2000s</span><div class="track"><div class="fill" style="width:35%;"></div></div><span class="value">10</span></div>
            </div>
            <div class="stat-group">
              <h3>🎸 Por Gênero</h3>
              <div class="stat-bar"><span class="label">Rock</span><div class="track"><div class="fill rock" style="width:55%;"></div></div><span class="value">45</span></div>
              <div class="stat-bar"><span class="label">Metal</span><div class="track"><div class="fill metal" style="width:40%;"></div></div><span class="value">30</span></div>
              <div class="stat-bar"><span class="label">Jazz</span><div class="track"><div class="fill jazz" style="width:20%;"></div></div><span class="value">12</span></div>
            </div>
          </div>
        </section>
      `;

      container.innerHTML = html;
    }

    function copiarLink() {
      const url = window.location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => alert('✅ Link copiado!'));
      } else {
        prompt('Copie o link:', url);
      }
    }

    document.addEventListener('DOMContentLoaded', carregarPerfil);
  </script>
</body>
</html>
